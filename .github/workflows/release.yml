name: Release

# Push a tag such as v1.6.0 to build a signed APK and AAB and attach them to
# a GitHub release. The tag must match `version:` in pubspec.yaml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          echo "tag=$TAG pubspec=$VERSION"
          if [ "${TAG%%-*}" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $VERSION. Bump pubspec.yaml and lib/app/app_info.dart first."
            exit 1
          fi

      # Refuse to publish a debug-signed release: Gradle would quietly fall
      # back to the debug key without these.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README, 'Release signing'."
            exit 1
          fi

      - name: Write the keystore and android/key.properties
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build APK and AAB
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Name the files and print the signing certificate
        run: |
          NAME="ExaTon-${GITHUB_REF_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/$NAME.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # The certificate fingerprint users can compare against the README.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$NAME.apk" | { grep -i "SHA-256" || true; } | head -1 | tee -a dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: exaton-android-release
          path: dist/

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
