name: Release

# Builds Android, Windows, macOS and Linux and publishes them as one GitHub
# release when a version tag is pushed. Tags may start with "v" or not:
#   v1.6.0  1.6.0  v1.6.0-beta.1  1.6.0-rc1
# The x.y.z part must match `version:` in pubspec.yaml. A tag with a "-"
# suffix is published as a pre-release.
#
# Run it by hand (Actions > Release > Run workflow) to build every platform
# without publishing; the files are kept as run artifacts.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  version:
    name: Version and tests
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      label: ${{ steps.v.outputs.label }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            BARE="${TAG#v}"
            BASE="${BARE%%-*}"
            if [ "$BASE" != "$NAME" ]; then
              echo "::error::Tag $TAG is version $BASE but pubspec.yaml says $NAME. Bump pubspec.yaml and lib/app/app_info.dart, or retag."
              exit 1
            fi
            LABEL="$TAG"
            PUBLISH=true
            case "$BARE" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          else
            LABEL="v$NAME-dev.${GITHUB_SHA::7}"
            PUBLISH=false
            PRERELEASE=true
          fi
          echo "name=$NAME label=$LABEL publish=$PUBLISH prerelease=$PRERELEASE"
          {
            echo "name=$NAME"
            echo "label=$LABEL"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: version
    runs-on: ubuntu-24.04
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      # Refuse to ship a debug-signed APK: Gradle would quietly fall back to
      # the debug key without these.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README, 'Release signing'."
            exit 1
          fi

      - name: Write the keystore and android/key.properties
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build APK and AAB
        run: |
          ARGS="--release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}"
          flutter build apk $ARGS
          flutter build appbundle $ARGS

      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ExaTon-$LABEL-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ExaTon-$LABEL-android.aab"
          # The certificate fingerprint users can compare between releases.
          # The runner ships several build-tools versions; use the newest.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          echo "Using $APKSIGNER"
          CERTS="$("$APKSIGNER" verify --print-certs "dist/ExaTon-$LABEL-android.apk")"
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key, not the release keystore."
            exit 1
          fi
          echo "$CERTS" | grep -i "SHA-256 digest" | head -1 > dist/android-signing-certificate.txt
          if [ ! -s dist/android-signing-certificate.txt ]; then
            echo "::error::Could not read the APK signing certificate."
            exit 1
          fi
          cat dist/android-signing-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-24.04
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # GTK toolchain for Flutter, libsecret for the token store.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: Package
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release --transform 's/^bundle/ExaTon/' \
            -czf "dist/ExaTon-$LABEL-linux-x64.tar.gz" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "stage/ExaTon"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $stage
          Compress-Archive -Path $stage -DestinationPath "dist/ExaTon-$env:LABEL-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Universal (Apple silicon and Intel), ad-hoc signed, not notarized.
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: Package
        run: |
          mkdir -p dist stage
          cp -R build/macos/Build/Products/Release/ExaTon.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname ExaTon -srcfolder stage -ov -format UDZO "dist/ExaTon-$LABEL-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/

  publish:
    name: Publish
    needs: [version, android, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ExaTon-* > SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          echo "Android signing certificate:" >> SHA256SUMS.txt
          cat android-signing-certificate.txt >> SHA256SUMS.txt
          rm android-signing-certificate.txt
          cat SHA256SUMS.txt

      # Every platform in one place for a manual run, which does not publish.
      - uses: actions/upload-artifact@v4
        with:
          name: exaton-${{ needs.version.outputs.label }}
          path: dist/

      - name: Publish the GitHub release
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ExaTon ${{ needs.version.outputs.label }}
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
